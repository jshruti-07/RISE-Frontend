<!DOCTYPE html>

<html lang="en">

<head>

    <title>Login | Altzor EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- YOUR CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Lottie Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>

<body class="login-page">
    <div class="login-container">
        <!-- LEFT SIDE -->
        <div class="login-left">
            <!-- Floating Background Circles -->
            <div class="floating-shapes">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <!-- Centered Bouncing Logo -->
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo_login.png') }}" alt="logo">
            </div>
        </div>
        <!-- RIGHT SIDE -->
        <div class="login-right">
            <div class="login-card">
                <h4>Welcome to RISE </h4>
                <span></span>
                <form method="POST" action="/login" id="loginForm">
                    <div class="mb-3">
                        <label>Username</label>
                        <input type="text" name="username" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3 position-relative">
                        <label>Password</label>
                        <input type="password" name="password" id="password" class="form-control pe-5" required>
                        <i class="bi bi-eye" id="eyeIcon" onclick="togglePassword()"></i>
                    </div>
                    <div id="login-error" class="text-danger mb-3" style="display:none;"></div>
                    <div class="d-flex justify-content-end mb-3">
                        <a href="/forgot-password" class="text-decoration-none small">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn-login w-100" id="loginBtn">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- MANDATORY PASSWORD CHANGE MODAL -->
    <div class="modal fade" id="passwordChangeModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 15px; overflow: hidden;">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title" id="staticBackdropLabel">
                        <i class="bi bi-shield-lock-fill me-2"></i>First-Time Password Update
                    </h5>
                </div>
                <div class="modal-body p-4">
                    <div class="alert alert-info border-0 mb-4"
                        style="background: rgba(13, 110, 253, 0.1); color: #0d6efd;">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        For your security, please update your password before proceeding.
                    </div>
                    <form id="passwordUpdateForm">
                        <div class="mb-3">
                            <label class="form-label fw-600">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-key"></i></span>
                                <input type="password" id="new_password" class="form-control border-start-0"
                                    placeholder="Minimum 8 characters" required>
                            </div>
                            <div id="password-strength" class="mt-2 small"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-600">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i
                                        class="bi bi-check2-circle"></i></span>
                                <input type="password" id="confirm_password" class="form-control border-start-0"
                                    placeholder="Repeat new password" required>
                            </div>
                        </div>
                        <div id="modal-error" class="text-danger mb-3 small" style="display:none;"></div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="updateBtn">
                            Update Password & Access Dashboard
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById("password");
            const icon = document.getElementById("eyeIcon");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("bi-eye");
                icon.classList.add("bi-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("bi-eye-slash");
                icon.classList.add("bi-eye");
            }
        }

        // LOGIN FLOW
        const loginForm = document.getElementById("loginForm");
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const loginError = document.getElementById("login-error");
            const loginBtn = document.getElementById("loginBtn");

            loginError.style.display = "none";
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Authenticating...';

            const formData = new FormData(loginForm);
            try {
                const response = await fetch("/login", {
                    method: "POST",
                    body: formData,
                    headers: { "X-Requested-With": "XMLHttpRequest" }
                });
                const data = await response.json();

                if (data.success) {
                    if (data.password_change_required) {
                        const modal = new bootstrap.Modal(document.getElementById('passwordChangeModal'));
                        modal.show();
                    } else {
                        window.location.href = "/dashboard";
                    }
                } else {
                    loginError.textContent = data.error || "Login failed";
                    loginError.style.display = "block";
                }
            } catch (err) {
                loginError.textContent = "Server error occurred";
                loginError.style.display = "block";
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = "Login";
            }
        });

        // PASSWORD CHANGE FLOW
        const passwordForm = document.getElementById("passwordUpdateForm");
        passwordForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const modalError = document.getElementById("modal-error");
            const updateBtn = document.getElementById("updateBtn");
            const newPass = document.getElementById("new_password").value;
            const confirmPass = document.getElementById("confirm_password").value;

            modalError.style.display = "none";

            // Client-side validation
            if (newPass !== confirmPass) {
                modalError.textContent = "Passwords do not match";
                modalError.style.display = "block";
                return;
            }

            if (newPass.length < 8) {
                modalError.textContent = "Password must be at least 8 characters long";
                modalError.style.display = "block";
                return;
            }

            updateBtn.disabled = true;
            updateBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Updating...';

            try {
                const response = await fetch("/change-password", {
                    method: "POST",
                    body: new URLSearchParams({
                        "new_password": newPass,
                        "confirm_password": confirmPass
                    }),
                    headers: { "Content-Type": "application/x-www-form-urlencoded" }
                });

                if (response.redirected) {
                    window.location.href = response.url;
                } else {
                    const data = await response.json();
                    if (data.success) {
                        window.location.href = "/dashboard";
                    } else {
                        modalError.textContent = data.error || "Failed to update password";
                        modalError.style.display = "block";
                    }
                }
            } catch (err) {
                modalError.textContent = "Connection error";
                modalError.style.display = "block";
            } finally {
                updateBtn.disabled = false;
                updateBtn.innerHTML = "Update Password & Access Dashboard";
            }
        });

        // PASS STRENGTH UI
        document.getElementById("new_password").addEventListener("input", (e) => {
            const val = e.target.value;
            const strengthEl = document.getElementById("password-strength");

            if (val.length === 0) {
                strengthEl.innerHTML = "";
                return;
            }

            let strength = 0;
            if (val.length >= 8) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[@$!%*?&]/.test(val)) strength++;

            if (strength === 0) strengthEl.innerHTML = '<span class="text-danger">Too short</span>';
            else if (strength === 1) strengthEl.innerHTML = '<span class="text-warning">Weak (Needs Uppercase/Special Char)</span>';
            else if (strength === 2) strengthEl.innerHTML = '<span class="text-info">Medium (Needs Uppercase/Special Char)</span>';
            else strengthEl.innerHTML = '<span class="text-success">Strong Password!</span>';
        });
    </script>

    <style>
        .fw-600 {
            font-weight: 600;
        }

        #eyeIcon {
            position: absolute;
            right: 15px;
            top: 38px;
            cursor: pointer;
            color: #6c757d;
            z-index: 10;
        }

        .modal-content {
            background: #ffffff;
        }
    </style>

</body>

</html>
