<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Password | Altzor EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="login-page">
    <div class="login-container">
        <!-- LEFT SIDE -->
        <div class="login-left">
            <div class="floating-shapes">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo_login.png') }}" alt="logo">
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="login-right">
            <div class="login-card">
                <h4>Reset Password</h4>
                <p class="text-muted mb-4">Enter your new password below</p>

                <div id="alert-container"></div>

                <form id="resetPasswordForm">
                    <div class="mb-3">
                        <label>New Password</label>
                        <div class="input-group">
                            <input type="password" name="new_password" id="new_password" class="form-control" placeholder="Minimum 8 characters" required>
                            <span class="input-group-text bg-white"><i class="bi bi-eye" id="eyeIcon1" onclick="togglePassword('new_password', 'eyeIcon1')"></i></span>
                        </div>
                        <div id="password-strength" class="mt-2 small"></div>
                    </div>

                    <div class="mb-3">
                        <label>Confirm Password</label>
                        <div class="input-group">
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Repeat new password" required>
                            <span class="input-group-text bg-white"><i class="bi bi-eye" id="eyeIcon2" onclick="togglePassword('confirm_password', 'eyeIcon2')"></i></span>
                        </div>
                    </div>

                    <button type="submit" class="btn-login w-100" id="submitBtn">
                        Reset Password
                    </button>
                </form>

                <div class="mt-3 text-center">
                    <a href="/login" class="text-decoration-none small">Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = '{{ token }}';
        const form = document.getElementById('resetPasswordForm');
        const alertContainer = document.getElementById('alert-container');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type) {
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }

        // Password strength indicator
        document.getElementById('new_password').addEventListener('input', (e) => {
            const val = e.target.value;
            const strengthEl = document.getElementById('password-strength');

            if (val.length === 0) {
                strengthEl.innerHTML = '';
                return;
            }

            let strength = 0;
            if (val.length >= 8) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[@$!%*?&]/.test(val)) strength++;

            if (strength === 0) strengthEl.innerHTML = '<span class="text-danger">Too short</span>';
            else if (strength === 1) strengthEl.innerHTML = '<span class="text-warning">Weak (Needs Uppercase/Special Char)</span>';
            else if (strength === 2) strengthEl.innerHTML = '<span class="text-info">Medium (Needs Uppercase/Special Char)</span>';
            else strengthEl.innerHTML = '<span class="text-success">Strong Password!</span>';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPass = form.new_password.value;
            const confirmPass = form.confirm_password.value;

            // Client-side validation
            if (newPass !== confirmPass) {
                showAlert('Passwords do not match', 'danger');
                return;
            }

            if (newPass.length < 8) {
                showAlert('Password must be at least 8 characters long', 'danger');
                return;
            }

            if (!/[A-Z]/.test(newPass) || !/[@$!%*?&]/.test(newPass)) {
                showAlert('Password must include a capital letter and a special character', 'danger');
                return;
            }

            if (!token) {
                showAlert('Invalid or missing reset token', 'danger');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Resetting...';

            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPass,
                        confirm_password: confirmPass
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert(data.message, 'success');
                    form.reset();
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showAlert(data.error || 'Failed to reset password', 'danger');
                }
            } catch (err) {
                showAlert('Server error occurred', 'danger');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Reset Password';
            }
        });
    </script>
</body>
</html>
