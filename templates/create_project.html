{% extends "base.html" %}
{% block title %}Create Project{% endblock %}

{% block content %}
<style>
    .custom-radio {
        padding: 10px 20px;
        border: 2px solid #e9ecef;
        border-radius: 12px;
        transition: all 0.3s ease;
        cursor: pointer;
    }
    .custom-radio:hover {
        border-color: #0d6efd;
        background-color: #f8f9fa;
    }
    .custom-radio input:checked + label {
        color: #0d6efd;
    }
</style>
<div class="container-fluid mt-4">
    <div class="form-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5>
                <i class="bi bi-plus-circle-fill text-primary me-2"></i>
                Create New Project
            </h5>
        </div>

        <form id="createProjectForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="projectName" class="form-label">Project Name *</label>
                    <input type="text" class="form-control" id="projectName" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="startDate" class="form-label">Start Date *</label>
                    <input type="date" class="form-control" id="startDate" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="customerName" class="form-label">Customer Name *</label>
                    <input type="text" class="form-control" id="customerName" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="endDate" class="form-label">End Date *</label>
                    <input type="date" class="form-control" id="endDate" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="customerContact" class="form-label">Customer Contact Person *</label>
                    <input type="text" class="form-control" id="customerContact" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="customerPhone" class="form-label">Customer Contact Number *</label>
                    <input type="tel" class="form-control" id="customerPhone" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="customerEmail" class="form-label">Customer Email ID *</label>
                    <input type="email" class="form-control" id="customerEmail" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="assignedManager" class="form-label">Assign Manager *</label>
                    <select class="form-control" id="assignedManager" required>
                        <option value="">Select Manager</option>
                        {% for manager in managers %}
                        <option value="{{ manager.name }}">{{ manager.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label d-block">Billing Model *</label>
                    <div class="d-flex gap-4">
                        <div class="form-check custom-radio">
                            <input class="form-check-input" type="radio" name="projectType" id="fixedCost" value="fixed" required>
                            <label class="form-check-label" for="fixedCost">
                                <i class="bi bi-cash-stack text-success me-1"></i> Fixed Cost
                            </label>
                        </div>
                        <div class="form-check custom-radio">
                            <input class="form-check-input" type="radio" name="projectType" id="timeMaterial" value="tm" required>
                            <label class="form-check-label" for="timeMaterial">
                                <i class="bi bi-clock-history text-primary me-1"></i> Time & Material
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-2"></i>
                    Create Project
                </button>
                <a href="{{ url_for('projects.projects_list') }}" class="btn btn-secondary">
                    <i class="bi bi-x-circle me-2"></i>
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Success Modal -->
<div class="modal fade" id="successModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-check-circle-fill text-success me-2"></i>
                    Success
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="successModalContent">
                    <!-- Content will be populated dynamically -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function createProject() {
    var formData = {
        name: document.getElementById('projectName').value,
        start_date: document.getElementById('startDate').value,
        end_date: document.getElementById('endDate').value,
        customer_name: document.getElementById('customerName').value,
        customer_contact: document.getElementById('customerContact').value,
        customer_phone: document.getElementById('customerPhone').value,
        customer_email: document.getElementById('customerEmail').value,
        assigned_manager: document.getElementById('assignedManager').value,
        project_type: document.querySelector('input[name="projectType"]:checked').value
    };

    fetch('/create_project', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
    })
    .then(function(response) {
        return response.json();
    })
    .then(function(data) {
        if (data.success) {
            showSuccessModal('Project Created', data.message);
            document.getElementById('createProjectForm').reset();
            
            // Redirect to projects page after a short delay
            setTimeout(function() {
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    window.location.href = '/projects';
                }
            }, 2000);
        } else {
            alert('Error: ' + data.error);
        }
    })
    .catch(function(error) {
        console.error('Error:', error);
        alert('Error creating project. Please try again.');
    });
}

function showSuccessModal(title, message) {
    var modalContent = '<div class="text-center">' +
        '<i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>' +
        '<h5 class="mt-3">' + title + '</h5>' +
        '<p class="text-muted">' + message + '</p>' +
        '</div>';
    
    document.getElementById('successModalContent').innerHTML = modalContent;
    var modal = new bootstrap.Modal(document.getElementById('successModal'));
    modal.show();
}

document.getElementById('createProjectForm').addEventListener('submit', function(e) {
    e.preventDefault();
    createProject();
});
</script>
{% endblock %}
