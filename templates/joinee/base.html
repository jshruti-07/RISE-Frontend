<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Onboarding{% endblock %} | RISE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/joinee.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="joinee-body">

    <!-- Top Bar -->
    <header class="joinee-topbar">
        <div class="joinee-topbar-inner">
            <!-- Logo -->
            <div class="joinee-topbar-logo">
                <img src="{{ url_for('static', filename='images/logo_login.png') }}" alt="RISE Logo" class="joinee-logo-img">
            </div>

            <!-- Center: Joinee Name -->
            <div class="joinee-topbar-name">
                <span class="joinee-greeting">Welcome, </span>
                <span class="joinee-name" id="topbarJoineeName">{{ joinee_name or 'New Joinee' }}</span>
            </div>

            <!-- Right: Logout -->
            <div class="joinee-topbar-actions">
                <a href="/logout" class="joinee-logout-btn">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="joinee-main">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
