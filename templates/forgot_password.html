<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password | Altzor EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="login-page">
    <div class="login-container">
        <!-- LEFT SIDE -->
        <div class="login-left">
            <div class="floating-shapes">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo_login.png') }}" alt="logo">
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="login-right">
            <div class="login-card">
                <h4>Forgot Password</h4>
                <p class="text-muted mb-4">Enter your email to receive a password reset link</p>

                <div id="alert-container"></div>

                <form id="forgotPasswordForm">
                    <div class="mb-3">
                        <label>Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <button type="submit" class="btn-login w-100" id="submitBtn">
                        Send Reset Link
                    </button>
                </form>

                <div class="mt-3 text-center">
                    <a href="/login" class="text-decoration-none small">Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('forgotPasswordForm');
        const alertContainer = document.getElementById('alert-container');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type) {
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = form.email.value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Sending...';

            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert(data.message, 'success');
                    form.reset();
                } else {
                    showAlert(data.error || 'Failed to send reset link', 'danger');
                }
            } catch (err) {
                showAlert('Server error occurred', 'danger');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
