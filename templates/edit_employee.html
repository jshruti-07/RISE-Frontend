{% extends "base.html" %}
{% block title %}Edit{% endblock %}
{% block page_title %}Edit Employee{% endblock %}

{% block content %}

<div class="container mt-4">

    <a href="{{ url_for('employees.employee_list') }}" class="back-link">
        <i class="bi bi-arrow-left"></i> Back to Records
    </a>

    <div class="form-card p-4">

        <div class="d-flex align-items-center gap-3 mb-3">

            <div class="icon-box bg-primary">
                <i class="bi bi-pencil-square"></i>
            </div>

            <div>
                <h5 class="mb-0">{{ labels.EDIT_EMPLOYEE }}</h5>
                <small class="text-muted">Update details</small>
            </div>

        </div>


        <div class="form-body">
            <form method="POST" enctype="multipart/form-data">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-person"></i>
                            Full Name
                        </label>
                        <div class="field-wrap">
                            <input type="text" class="form-control" name="name" value="{{ employee.name or '' }}" placeholder="Full name" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-envelope"></i>
                            Email
                        </label>
                        <div class="field-wrap">
                            <input type="email" class="form-control" name="email" value="{{ employee.email or '' }}" placeholder="Email address" required>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-telephone"></i>
                            Phone Number
                        </label>
                        <div class="field-wrap">
                            <input type="text" class="form-control" name="phone" value="{{ employee.phone or '' }}" placeholder="Phone number" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-calendar"></i>
                            Date of Birth
                        </label>
                        <div class="field-wrap">
                            <input type="date" class="form-control" name="date_of_birth"
                                value="{{ employee.date_of_birth[:10] if employee.date_of_birth else '' }}"
                                required>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-gender-male"></i>
                            Gender
                        </label>
                        <div class="field-wrap">
                            <select class="form-select" name="gender" required>
                                <option value="" disabled {% if not employee.gender %}selected{% endif %}>Select Gender</option>
                                <option value="Male" {% if employee.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if employee.gender == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Other" {% if employee.gender == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-briefcase"></i>
                            Employment Type
                        </label>
                        <div class="field-wrap">
                            <select class="form-select" name="employment_type" required>
                                <option value="" disabled {% if not employee.employment_type %}selected{% endif %}>Select Employment Type</option>
                                <option value="Full-time" {% if employee.employment_type == 'Full-time' %}selected{% endif %}>Full-time</option>
                                <option value="Part-time" {% if employee.employment_type == 'Part-time' %}selected{% endif %}>Part-time</option>
                                <option value="Contract" {% if employee.employment_type == 'Contract' %}selected{% endif %}>Contract</option>
                                <option value="Temporary" {% if employee.employment_type == 'Temporary' %}selected{% endif %}>Temporary</option>
                                <option value="Internship" {% if employee.employment_type == 'Internship' %}selected{% endif %}>Internship</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-person"></i>
                            Reporting Manager
                        </label>
                        <div class="field-wrap">
                            <input type="text" class="form-control" name="reporting_manager" value="{{ employee.reporting_manager or '' }}" placeholder="Reporting manager">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-geo-alt"></i>
                            Address
                        </label>
                        <div class="field-wrap">
                            <textarea class="form-control" name="address" placeholder="Address">{{ employee.address or '' }}</textarea>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-calendar"></i>
                            Date of Joining
                        </label>
                        <div class="field-wrap">
                            <input type="date" class="form-control" name="date_of_joining"
                                value="{{ employee.date_of_joining[:10] if employee.date_of_joining else '' }}"
                                required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-file-earmark"></i>
                            Update Document
                        </label>
                        <div class="field-wrap">
                            <input type="file" class="form-control" name="document">
                        </div>
                    </div>
                </div>



                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-person-badge"></i>
                            Role <span class="text-danger">*</span>
                        </label>
                        <div class="field-wrap">
                            <select class="form-select" name="role" required>
                                <option value="" disabled {% if not employee.role %}selected{% endif %}>Select Role</option>
                                <option value="admin" {% if employee.role == 'admin' %}selected{% endif %}>Admin</option>
                                <option value="superadmin" {% if employee.role == 'superadmin' %}selected{% endif %}>Super Admin</option>
                                <option value="accounts" {% if employee.role == 'accounts' %}selected{% endif %}>Accounts</option>
                                <option value="hr" {% if employee.role == 'hr' %}selected{% endif %}>HR</option>
                                <option value="manager" {% if employee.role == 'manager' %}selected{% endif %}>Manager</option>
                                <option value="employee" {% if employee.role == 'employee' or not employee.role %}selected{% endif %}>Team Member</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-briefcase"></i>
                            Designation <span class="text-danger">*</span>
                        </label>
                        <div class="field-wrap">
                            <select class="form-select" name="designation" required>
                                <option value="" disabled {% if not employee.designation %}selected{% endif %}>Select Designation</option>
                                <option value="Software Engineer" {% if employee.designation == 'Software Engineer' %}selected{% endif %}>Software Engineer</option>
                                <option value="Senior Software Engineer" {% if employee.designation == 'Senior Software Engineer' %}selected{% endif %}>Senior Software Engineer</option>
                                <option value="HR Executive" {% if employee.designation == 'HR Executive' %}selected{% endif %}>HR Executive</option>
                                <option value="HR Manager" {% if employee.designation == 'HR Manager' %}selected{% endif %}>HR Manager</option>
                                <option value="Project Manager" {% if employee.designation == 'Project Manager' %}selected{% endif %}>Project Manager</option>
                                <option value="Recruiter" {% if employee.designation == 'Recruiter' %}selected{% endif %}>Recruiter</option>
                                <option value="Senior Developer" {% if employee.designation == 'Senior Developer' %}selected{% endif %}>Senior Developer</option>
                                <option value="Team Lead" {% if employee.designation == 'Team Lead' %}selected{% endif %}>Team Lead</option>
                                <option value="QA Engineer" {% if employee.designation == 'QA Engineer' %}selected{% endif %}>QA Engineer</option>
                                <option value="DevOps Engineer" {% if employee.designation == 'DevOps Engineer' %}selected{% endif %}>DevOps Engineer</option>
                                <option value="Business Analyst" {% if employee.designation == 'Business Analyst' %}selected{% endif %}>Business Analyst</option>
                                <option value="Product Manager" {% if employee.designation == 'Product Manager' %}selected{% endif %}>Product Manager</option>
                                <option value="Technical Lead" {% if employee.designation == 'Technical Lead' %}selected{% endif %}>Technical Lead</option>
                                <option value="Data Analyst" {% if employee.designation == 'Data Analyst' %}selected{% endif %}>Data Analyst</option>
                                <option value="UI/UX Designer" {% if employee.designation == 'UI/UX Designer' %}selected{% endif %}>UI/UX Designer</option>
                                <option value="System Administrator" {% if employee.designation == 'System Administrator' %}selected{% endif %}>System Administrator</option>
                                <option value="Intern" {% if employee.designation == 'Intern' %}selected{% endif %}>Intern</option>
                                <option value="Trainee" {% if employee.designation == 'Trainee' %}selected{% endif %}>Trainee</option>
                                {% if employee.designation and employee.designation not in ['Software Engineer', 'Senior Software Engineer', 'HR Executive', 'HR Manager', 'Project Manager', 'Recruiter', 'Senior Developer', 'Team Lead', 'QA Engineer', 'DevOps Engineer', 'Business Analyst', 'Product Manager', 'Technical Lead', 'Data Analyst', 'UI/UX Designer', 'System Administrator', 'Intern', 'Trainee'] %}
                                <option value="{{ employee.designation }}" selected>{{ employee.designation }}</option>
                                {% endif %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="d-flex align-items-center gap-2">
                            <i class="bi bi-building"></i>
                            Department <span class="text-danger">*</span>
                        </label>
                        <div class="field-wrap">
                            <select class="form-select" name="department" required>
                                <option value="" disabled {% if not employee.department %}selected{% endif %}>Select Department</option>
                                <option value="Engineering" {% if employee.department == 'Engineering' %}selected{% endif %}>Engineering</option>
                                <option value="HR" {% if employee.department == 'HR' %}selected{% endif %}>HR</option>
                                <option value="Finance" {% if employee.department == 'Finance' %}selected{% endif %}>Finance</option>
                                <option value="Recruitment" {% if employee.department == 'Recruitment' %}selected{% endif %}>Recruitment</option>
                                <option value="Sales" {% if employee.department == 'Sales' %}selected{% endif %}>Sales</option>
                                <option value="Marketing" {% if employee.department == 'Marketing' %}selected{% endif %}>Marketing</option>
                                <option value="Operations" {% if employee.department == 'Operations' %}selected{% endif %}>Operations</option>
                                <option value="IT" {% if employee.department == 'IT' %}selected{% endif %}>IT</option>
                                <option value="Quality Assurance" {% if employee.department == 'Quality Assurance' %}selected{% endif %}>Quality Assurance</option>
                                <option value="Research & Development" {% if employee.department == 'Research & Development' %}selected{% endif %}>Research & Development</option>
                                <option value="Administration" {% if employee.department == 'Administration' %}selected{% endif %}>Administration</option>
                                <option value="Legal" {% if employee.department == 'Legal' %}selected{% endif %}>Legal</option>
                                <option value="Design" {% if employee.department == 'Design' %}selected{% endif %}>Design</option>
                                {% if employee.department and employee.department not in ['Engineering', 'HR', 'Finance', 'Recruitment', 'Sales', 'Marketing', 'Operations', 'IT', 'Quality Assurance', 'Research & Development', 'Administration', 'Legal', 'Design'] %}
                                <option value="{{ employee.department }}" selected>{{ employee.department }}</option>
                                {% endif %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Changes</button>
                    <a href="{{ url_for('employees.employee_list') }}" class="btn btn-light"><i class="bi bi-x"></i> Cancel</a>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
