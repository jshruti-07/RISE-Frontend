{% extends "base.html" %}
{% block title %}Edit Timesheet{% endblock %}

{% block content %}
<div class="form-card">

    <div class="d-flex align-items-center mb-4">
        <i class="bi bi-pencil-square fs-3 me-2 text-primary"></i>
        <div>
            <h5 class="mb-0 fw-bold">Edit Timesheet Entry</h5>
            <small class="text-muted">Update details and manager assignment</small>
        </div>
    </div>

    <form method="POST">

        <h6 class="mb-3 text-secondary fw-semibold">Details</h6>
        <input type="hidden" name="employee_name" value="{{ session.employee_name }}">

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Project <span class="text-danger">*</span></label>
                <select name="project" id="projectSelect" class="form-select" required>
                    <option value="">Select Project</option>
                    {% for p in projects %}
                        <option value="{{ p.name }}" data-manager="{{ p.assigned_manager or p.manager_name or p.assigned_manager_name or '' }}" {% if timesheet.project == p.name %}selected{% endif %}>{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Approving Manager <span class="text-danger">*</span></label>
                <select name="manager_name" id="managerSelect" class="form-select" required>
                    <option value="">Select Manager</option>
                    {% for m in managers %}
                        <option value="{{ m.employee_name or m.name }}" {% if (timesheet.manager_name and (timesheet.manager_name == m.employee_name or timesheet.manager_name == m.name)) or (not timesheet.manager_name and timesheet.assigned_manager == (m.employee_name or m.name)) %}selected{% endif %}>{{ (m.display_name or m.name or m.employee_name) | clean_name }}{% if m.designation %} ({{ m.designation }}){% endif %}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Task <span class="text-danger">*</span></label>
                <input type="text" name="task" class="form-control" value="{{ timesheet.task or '' }}" placeholder="What did you work on?" required>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-semibold">Hours <span class="text-danger">*</span></label>
                <input type="number" step="0.1" min="0.1" max="24" name="hours" class="form-control" value="{{ timesheet.hours or '' }}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                <input type="date" name="start_date" class="form-control" value="{{ timesheet.start_date[:10] if timesheet.start_date else '' }}" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ timesheet.description or '' }}</textarea>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary px-4 fw-semibold">Update Timesheet</button>
            <a href="{{ url_for('work.timesheets_list') }}" class="btn btn-light px-4">Cancel</a>
        </div>

    </form>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const projectSelect = document.getElementById('projectSelect');
    const managerSelect = document.getElementById('managerSelect');

    if (projectSelect && managerSelect) {
        projectSelect.addEventListener('change', function() {
            const selectedOpt = projectSelect.options[projectSelect.selectedIndex];
            const defaultMgr = selectedOpt ? selectedOpt.getAttribute('data-manager') : '';
            if (defaultMgr) {
                for (let i = 0; i < managerSelect.options.length; i++) {
                    if (managerSelect.options[i].value.toLowerCase() === defaultMgr.toLowerCase()) {
                        managerSelect.selectedIndex = i;
                        break;
                    }
                }
            }
        });
    }
});
</script>
{% endblock %}
