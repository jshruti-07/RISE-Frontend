{% extends "base.html" %}
{% block title %}{{ labels.ADD_EMPLOYEE }}{% endblock %}

{% block content %}

<div class="form-card">

    <!-- HEADER -->
    <div class="d-flex align-items-center mb-4">
        <div class="me-3">
            <i class="bi bi-person-plus-fill fs-3"></i>
        </div>
        <div>
            <h5 class="mb-0">{{ labels.NEW_EMPLOYEE }}</h5>
            <small class="text-muted">Fill in details</small>
        </div>
    </div>

    <!-- FORM -->
    <form action="{{ url_for('employees.add_employee') }}" method="POST" enctype="multipart/form-data">

        <!-- Personal Info -->
        <h6 class="mb-3">Personal Information</h6>

        <div class="row mb-3">
            <div class="col-md-6">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label>Role</label>
                <select name="role" class="form-select" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="admin">Admin</option>
                    <option value="hr">HR</option>
                    <option value="manager">Manager</option>
                    <option value="employee">Team Member</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label>Date of Birth</label>
                <input type="date" name="date_of_birth" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label>Date of Joining</label>
                <input type="date" name="date_of_joining" class="form-control" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label>Gender</label>
                <select name="gender" class="form-select" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                    <option value="Prefer not to say">Prefer not to say</option>
                </select>
            </div>
            <div class="col-md-6">
                <label>Address</label>
                <input type="text" name="address" class="form-control" required>
            </div>
        </div>

        <!-- Contact -->
        <h6 class="mb-3">Contact Details</h6>

        <div class="row mb-3">
            <div class="col-md-6">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control" required>
            </div>
        </div>

        <!-- Employement Details -->
        <h6 class="mb-3">Employement Details</h6>

        <div class="row mb-3">
            <div class="col-md-6">
                <label>Employement Type</label>
                <select name="employment_type" class="form-select" required>
                    <option value="" disabled selected>Select Employement Type</option>
                    <option value="Full Time">Full Time</option>
                    <option value="Part Time">Part Time</option>
                    <option value="Contract">Contract</option>
                    <option value="Intern">Intern</option>
                    <option value="Freelancer">Freelancer</option>
                    <option value="Temporary">Temporary</option>
                </select>
            </div>
            <div class="col-md-6">
                <label>Designation</label>
                <select name="designation" class="form-select" required>
                    <option value="" disabled selected>Select Designation</option>
                    <option value="Software Engineer">Software Engineer</option>
                    <option value="Senior Software Engineer">Senior Software Engineer</option>
                    <option value="HR Executive">HR Executive</option>
                    <option value="HR Manager">HR Manager</option>
                    <option value="Project Manager">Project Manager</option>
                    <option value="Recruiter">Recruiter</option>
                    <option value="Senior Developer">Senior Developer</option>
                    <option value="Team Lead">Team Lead</option>
                    <option value="QA Engineer">QA Engineer</option>
                    <option value="DevOps Engineer">DevOps Engineer</option>
                    <option value="Business Analyst">Business Analyst</option>
                    <option value="Product Manager">Product Manager</option>
                    <option value="Technical Lead">Technical Lead</option>
                    <option value="Data Analyst">Data Analyst</option>
                    <option value="UI/UX Designer">UI/UX Designer</option>
                    <option value="System Administrator">System Administrator</option>
                    <option value="Intern">Intern</option>
                    <option value="Trainee">Trainee</option>
                </select>
            </div>
            <div class="col-md-6">
                <label>Department</label>
                <select name="department" class="form-select" required>
                    <option value="" disabled selected>Select Department</option>
                    <option value="Engineering">Engineering</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="Recruitment">Recruitment</option>
                    <option value="Operations">Operations</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Sales">Sales</option>
                    <option value="Legal">Legal</option>
                    <option value="IT">IT</option>
                    <option value="Administration">Administration</option>
                    <option value="Product">Product</option>
                    <option value="Design">Design</option>
                    <option value="Quality Assurance">Quality Assurance</option>
                    <option value="Customer Support">Customer Support</option>
                    <option value="Research & Development">Research & Development</option>
                </select>
            </div>
        </div>

        <!-- Documents -->
        <h6 class="mb-3">Documents <small class="text-muted fw-normal">(optional)</small></h6>
        <div class="row mb-3">
            <div class="col-md-6">
                <label>Resume / CV (PDF)</label>
                <input type="file" name="pdf_file" class="form-control" accept=".pdf">
            </div>
            <div class="col-md-6">
                <label>Offer Letter / Contract (DOCX)</label>
                <input type="file" name="docx_file" class="form-control" accept=".doc,.docx">
            </div>
        </div>

        <!-- ACTIONS -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="reset" class="btn btn-light" style="background-color: rgb(184, 183, 183); color: rgb(0, 0, 0); border-radius: 10px;">Reset</button>
            <a href="{{ url_for('employees.employee_list') }}" class="btn btn-light" style="background-color: rgb(255, 173, 173); color: rgb(0, 0, 0); border-radius: 10px;">Cancel</a>
        </div>

    </form>


</div>

{% endblock %}
