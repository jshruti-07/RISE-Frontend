{% extends "base.html" %}
{% block title %}Add Timesheet{% endblock %}

{% block content %}
<div class="form-card">

    <div class="d-flex align-items-center mb-4">
        <i class="bi bi-clock-fill fs-3 me-2"></i>
        <div>
            <h5 class="mb-0">New Timesheet Entry</h5>
            <small class="text-muted">Fill details</small>
        </div>
    </div>

    <form method="POST">

        <h6 class="mb-3">Details</h6>
        <input type="hidden" name="employee_name" value="{{ session.employee_name }}">

        <div class="row mb-3">
            <div class="col-md-6">
                <label>Project</label>
                <select name="project" class="form-control" required>
                    <option value="">Select Project</option>
                    {% for p in projects %}
                        <option value="{{ p.name }}">{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label>Task</label>
                <input type="text" name="task" class="form-control" placeholder="What did you work on?" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label>Hours</label>
                <input type="number" step="0.1" name="hours" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label>Date</label>
                <input type="date" name="start_date" class="form-control" value="{{ today_date }}" max="{{ today_date }}" required>
            </div>
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary">Submit</button>
            <a href="{{ url_for('work.timesheets_list') }}" class="btn btn-light">Cancel</a>
        </div>

    </form>

</div>
{% endblock %}
